<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond circulaire sombre avec bordure stadium lumineuse -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="18" filter="url(#glow)"/>

  <!-- Ballon de Baby-Foot au centre -->
  <circle cx="256" cy="256" r="150" fill="url(#ballGrad)"/>
  
  <!-- Motifs du ballon : Pentagone central -->
  <polygon points="256,182 316,226 293,298 219,298 196,226" fill="#0f172a" />
  
  <!-- Lignes du ballon vers l'extérieur -->
  <line x1="256" y1="182" x2="256" y2="108" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  <line x1="316" y1="226" x2="384" y2="192" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  <line x1="293" y1="298" x2="344" y2="364" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  <line x1="219" y1="298" x2="168" y2="364" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  <line x1="196" y1="226" x2="128" y2="192" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>

  <!-- Éclair Tredemi doré au cœur du pentagone -->
  <polygon points="262,212 242,246 258,246 250,282 274,240 258,240" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Badge Balle Positive Verte (+4) -->
  <g transform="translate(378, 114)">
    <circle cx="0" cy="0" r="46" fill="#10b981" stroke="#ffffff" stroke-width="7" />
    <text x="0" y="14" font-family="'Outfit', -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">+4</text>
  </g>

  <!-- Badge Balle Négative Rouge (-2) -->
  <g transform="translate(134, 396)">
    <circle cx="0" cy="0" r="46" fill="#ef4444" stroke="#ffffff" stroke-width="7" />
    <text x="0" y="14" font-family="'Outfit', -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">-2</text>
  </g>
</svg>
